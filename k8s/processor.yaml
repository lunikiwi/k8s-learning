# ─────────────────────────────────────────────────────────────────────────────
# processor-service — middle tier of the request chain.
#   GET /process  → calls storage-service, enriches the payload
#   GET /healthz  → { status: "ok" }
#
# Runs with TWO replicas on purpose: the gateway talks to the ClusterIP Service
# "processor-service", so kube-proxy round-robins between both pods. Repeated
# "curl /ping" calls will show alternating "processor.pod" values — that is the
# built-in L4 load balancing. Deleting one pod demonstrates failover: the
# readiness probe removes it from the Endpoints list and traffic keeps flowing.
#
# NOTE: the gateway's Go HTTP client keeps connections alive
# (MaxIdleConnsPerHost = 100), so a SEQUENTIAL curl loop reuses one TCP
# connection and always hits the same pod. Send requests concurrently to see
# the spread (verified: ~15/25 over 40 requests):
#   seq 40 | xargs -P 10 -I{} sh -c \
#     'curl -s localhost:8080/ping | jq -r .processor.pod' | sort | uniq -c
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-service
  labels:
    app: processor-service
    app.kubernetes.io/name: processor-service
    app.kubernetes.io/part-of: k8s-learning
    app.kubernetes.io/component: processor
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: processor-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: processor-service
        app.kubernetes.io/name: processor-service
        app.kubernetes.io/part-of: k8s-learning
        app.kubernetes.io/component: processor
    spec:
      terminationGracePeriodSeconds: 20
      # Spread the two replicas across nodes when the cluster has more than one
      # agent; "ScheduleAnyway" keeps it working on a single-node k3d cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: processor-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: processor-service
          image: processor-service:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # In-cluster DNS name of the storage Service (same namespace).
            - name: STORAGE_SERVICE_URL
              value: "http://storage-service:8080/data"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: processor-service
  labels:
    app: processor-service
    app.kubernetes.io/name: processor-service
    app.kubernetes.io/part-of: k8s-learning
spec:
  type: ClusterIP
  selector:
    app: processor-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
